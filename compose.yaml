services:
  app:
    image: "${NAV_PALACE_IMAGE:-nav-palace:local}"
    restart: unless-stopped
    # 转发退出信号并回收子进程，便于容器正常停止。
    init: true
    # 默认仅监听本机；需要公网预览时通过 HOST_IP 和 PORT 指定绑定地址。
    ports:
      - "${HOST_IP:-127.0.0.1}:${PORT:-30010}:3000"
    environment:
      NODE_ENV: production
      # 主访问地址自动加入白名单；额外入口以逗号分隔，包含协议及对外端口。
      BETTER_AUTH_URL: "${BETTER_AUTH_URL:-http://127.0.0.1:${PORT:-30010}}"
      ALLOWED_ORIGINS: "${ALLOWED_ORIGINS:-}"
      # 兼容旧部署显式传入的凭据；留空时使用数据卷里的值，首次启动自动生成。
      BETTER_AUTH_SECRET: "${BETTER_AUTH_SECRET:-}"
      SETUP_TOKEN: "${SETUP_TOKEN:-}"
      DATABASE_PATH: /app/data/nav-palace.db
    # 持久化数据库、上传图片和运行凭据，重建容器时复用。
    volumes:
      - nav-palace-data:/app/data
    # 通过首页请求检查应用是否能正常响应，为首次启动预留缓冲时间。
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

volumes:
  nav-palace-data:
